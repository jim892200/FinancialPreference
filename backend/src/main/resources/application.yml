spring:
  application:
    name: financial-preference
  profiles:
    active: dev

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # 32+ 字元 HMAC-SHA256 secret。請務必以環境變數 APP_JWT_SECRET 覆寫，勿用以下開發用值上線。
    secret: ${APP_JWT_SECRET:dev-only-secret-please-override-32+chars}
    ttl-minutes: ${APP_JWT_TTL_MINUTES:60}
