# Isolated test stack — verifies that `docker compose up` brings the whole app up in one shot.
# Uses different host ports so it won't clash with the existing sql2022 container.
#
# Usage:
#   docker compose -p fp-test -f docker-compose.test.yml up -d --build
#   docker compose -p fp-test -f docker-compose.test.yml down -v
#
# Host ports:
#   SQL Server : 1434
#   Backend    : 8081
#   Frontend   : 5174

services:
  sql2022:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fp-test-sql2022
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - mssql-data-test:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fp-test-db-init
    depends_on:
      sql2022:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    volumes:
      - ./DB:/scripts:ro
    entrypoint: ["/bin/bash","-c"]
    command:
      - |
        set -e
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        echo "[db-init] Creating database if missing..."
        $$SQLCMD -S sql2022 -U sa -P "$$MSSQL_SA_PASSWORD" -C \
          -Q "IF DB_ID(N'FinancialPreference') IS NULL CREATE DATABASE FinancialPreference;"
        EXISTS=$$($$SQLCMD -S sql2022 -U sa -P "$$MSSQL_SA_PASSWORD" -C \
          -d FinancialPreference -h -1 -W \
          -Q "SET NOCOUNT ON; IF OBJECT_ID(N'dbo.PRODUCT','U') IS NULL PRINT 'NO'; ELSE PRINT 'YES';" | tr -d '[:space:]')
        if [ "$$EXISTS" = "NO" ]; then
          echo "[db-init] Loading schema / SP / seed..."
          $$SQLCMD -S sql2022 -U sa -P "$$MSSQL_SA_PASSWORD" -C -d FinancialPreference -i /scripts/01_schema.sql
          $$SQLCMD -S sql2022 -U sa -P "$$MSSQL_SA_PASSWORD" -C -d FinancialPreference -i /scripts/02_stored_procedures.sql
          $$SQLCMD -S sql2022 -U sa -P "$$MSSQL_SA_PASSWORD" -C -d FinancialPreference -i /scripts/03_seed_data.sql
          echo "[db-init] Done."
        else
          echo "[db-init] Schema already present, skipping."
        fi
    restart: "no"

  backend:
    build: ./backend
    container_name: fp-test-backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MSSQL_PASSWORD: "YourStrong@Passw0rd"
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5174,http://localhost:5173"
    ports:
      - "8081:8080"

  frontend:
    build: ./frontend
    container_name: fp-test-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:80"

volumes:
  mssql-data-test:
